[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercadoalba-elt"
version = "0.1.0"
description = "Reference Airflow ELT for a fictitious Mexican omnichannel retailer. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Edgar Flores" }]
keywords = ["airflow", "elt", "duckdb", "bigquery", "synthetic-data"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "duckdb>=2,<3",
  "numpy>=1.26,<2",
  "pyarrow>=16,<20",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
dev = [
  "apache-airflow==2.10.5",
  "pytest",
  "ruff",
]

[project.scripts]
mercadoalba = "mercadoalba.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".airflow-tests", "data", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
